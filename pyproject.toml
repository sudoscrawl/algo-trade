[project]
name = "algo-trade"
version = "0.1.0"
description = "Basic algo trading system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.30.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
